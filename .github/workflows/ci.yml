name: CI

# Build + test gate for pull requests: the whole solution compiles, the xUnit suite passes, the
# Luau runtime behaves, and every emitted .luau is valid syntax. No deploy (see deploy-docs.yml).
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Builds every project + the sample, which fetches the API dump and emits
      # samples/HelloWorld/out-luau via the transpiler task.
      - name: Build solution + emit sample
        run: dotnet build rbxcs.slnx -c Release -nodeReuse:false

      - name: Test (xUnit)
        run: dotnet test tests/RobloxCS.Tests/RobloxCS.Tests.csproj -c Release --logger "console;verbosity=minimal"

      - name: Get luau
        run: |
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -o -q luau.zip -d luau-bin
          chmod +x luau-bin/* || true
          echo "luau-bin contents:"; ls -la luau-bin

      - name: Luau runtime spec
        run: |
          LUAU=$(find luau-bin -name 'luau' -type f | head -1)
          if [ -z "$LUAU" ]; then echo "luau runner not in release. Contents:"; ls -R luau-bin; exit 1; fi
          "$LUAU" tests/luau/runtime.spec.luau

      - name: Syntax-check emitted Luau
        run: |
          LC=$(find luau-bin -name 'luau-compile' -type f | head -1)
          if [ -z "$LC" ]; then echo "luau-compile not in this luau release; skipping (dotnet tests cover emit shape)."; exit 0; fi
          fail=0; n=0
          for f in $(find samples/HelloWorld/out-luau -name '*.luau'); do
            n=$((n+1)); "$LC" --binary "$f" >/dev/null || { echo "FAIL $f"; fail=1; }
          done
          echo "luau-compile: checked $n file(s)"
          exit $fail

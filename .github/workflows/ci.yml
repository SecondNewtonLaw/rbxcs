name: CI

# Build gate for pull requests: the whole solution compiles, the sample transpiles, and every
# emitted .luau is valid Luau syntax. No deploy (see deploy-docs.yml for that).
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Builds every project + the sample, which fetches the API dump and emits
      # samples/HelloWorld/out-luau via the transpiler task.
      - name: Build solution + emit sample
        run: dotnet build rbxcs.slnx -c Release -nodeReuse:false

      - name: Get luau-compile
        run: |
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -o -q luau.zip -d luau-bin
          chmod +x luau-bin/* || true

      - name: Syntax-check emitted Luau
        run: |
          LC=$(find luau-bin -name 'luau-compile' | head -1)
          if [ -z "$LC" ]; then echo "luau-compile not found in release. Contents:"; ls -R luau-bin; exit 1; fi
          fail=0; n=0
          for f in $(find samples/HelloWorld/out-luau -name '*.luau'); do
            n=$((n+1))
            "$LC" --binary "$f" >/dev/null || { echo "FAIL $f"; fail=1; }
          done
          echo "luau-compile: checked $n file(s)"
          exit $fail
